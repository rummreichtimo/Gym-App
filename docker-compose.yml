# Lokale Datenbank für die Entwicklung.
#   docker compose up -d
# Danach zeigt die DATABASE_URL aus .env.example direkt auf diesen Dienst.
services:
  db:
    image: postgres:16-alpine
    container_name: ironpath-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ironpath
    ports:
      - '5432:5432'
    volumes:
      - ironpath-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ironpath']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ironpath-db-data:
